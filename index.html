<script>
  // 1. PLACE YOUR GOOGLE DRIVE FOLDER ID HERE
  const FOLDER_ID = '1PqJlWpzNo1zmMwizf40Q39DQrvtfPvgZ';

  // 2. Adjust slideshow speed (in milliseconds)
  const SLIDE_DURATION = 4000; 

  async function loadGDriveSlideshow() {
    const container = document.getElementById('gdrive-slideshow');
    if (FOLDER_ID === 'YOUR_GOOGLE_DRIVE_FOLDER_ID_HERE') {
      container.innerHTML = '<p class="loading-text">Error: Please replace YOUR_GOOGLE_DRIVE_FOLDER_ID_HERE with your actual folder ID in the code.</p>';
      return;
    }

    try {
      // Use a public proxy to parse the public Google Drive folder structure
      const url = `https://allorigins.win{encodeURIComponent('https://google.com' + FOLDER_ID)}`;
      const response = await fetch(url);
      const data = await response.json();
      
      // Parse the HTML to extract image IDs
      const parser = new DOMParser();
      const doc = parser.parseFromString(data.contents, 'text/html');
      const textContent = data.contents;
      
      // Regex to capture file IDs within the Drive folder view page source
      const regex = /"([^"]+)"\s*,\s*\[\s*"([^"]+)"\s*,\s*"([^"]+)"\s*,\s*"image\/[^"]+"/g;
      let match;
      const imageIds = [];
      
      while ((match = regex.exec(textContent)) !== null) {
        if (match[1] && !imageIds.includes(match[1])) {
          imageIds.push(match[1]);
        }
      }

      if (imageIds.length === 0) {
        container.innerHTML = '<p class="loading-text">No images found. Ensure your folder is shared as "Anyone with the link can view".</p>';
        return;
      }

      // Clear loading text
      container.innerHTML = '';

      // Create image elements
      imageIds.forEach((id, index) => {
        const img = document.createElement('img');
        // Construct the direct image web link
        img.src = `https://googleusercontent.com{id}`;
        img.classList.add('slide-img');
        if (index === 0) img.classList.add('active');
        container.appendChild(img);
      });

      // Start the slideshow animation loop
      let currentSlide = 0;
      const slides = container.querySelectorAll('.slide-img');
      
      setInterval(() => {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
      }, SLIDE_DURATION);

    } catch (error) {
      console.error(error);
      container.innerHTML = '<p class="loading-text">Failed to load images. Please check your connection or folder link.</p>';
    }
  }

  // Initial load
  loadGDriveSlideshow();
</script>
