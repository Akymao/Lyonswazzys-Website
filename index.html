<body id="i99t"><div id="in5f" class="silex-default-container"><!-- 1. The HTML Container -->
<div class="pixiv-feed-container">
    <div id="pixiv-status-box" style="text-align: center; padding: 20px; color: #888; font-size: 14px;">Loading illustrations...</div>
    <div id="pixiv-grid-box" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;"></div>
</div>

<style>
    .pixiv-card {
        background: #ffffff;
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        transition: transform 0.2s ease;
    }
    .pixiv-card:hover { transform: translateY(-2px); }
    .pixiv-link { text-decoration: none; color: inherit; }
    .pixiv-img-wrapper {
        position: relative;
        width: 100%;
        padding-top: 100%;
        background-color: #f5f5f5;
    }
    .pixiv-img-wrapper img {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        object-fit: cover;
    }
</style>

<!-- 2. The Script Engine -->
<script>
(function() {
    document.addEventListener("DOMContentLoaded", () => {
        const PIXIV_USER_ID = "41623824"; 
        
        // Switched to a fallback RSSHub mirror instance that is much less congested
        const RSS_URL = "https://rssforever.com" + PIXIV_USER_ID;
        const API_URL = "https://allorigins.win" + encodeURIComponent(RSS_URL);

        const grid = document.getElementById('pixiv-grid-box');
        const status = document.getElementById('pixiv-status-box');

        if (!grid || !status) return;

        async function loadFeed() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network issue');
                const wrapper = await response.json();
                
                if (!wrapper.contents) throw new Error('Empty response');

                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(wrapper.contents, "text/xml");
                const items = xmlDoc.getElementsByTagName("item");

                if (!items || items.length === 0) {
                    throw new Error('No items found');
                }

                status.style.display = 'none';

                const limit = Math.min(items.length, 12);
                for (let i = 0; i < limit; i++) {
                    const item = items[i];
                    
                    const linkTag = item.getElementsByTagName("link");
                    let link = "https://pixiv.net" + PIXIV_USER_ID;
                    if (linkTag.length > 0) {
                        link = linkTag[0].textContent || linkTag[0].innerHTML || link;
                    }
                    
                    const descTag = item.getElementsByTagName("description");
                    const description = descTag.length > 0 ? descTag[0].textContent : "";
                    
                    const titleTag = item.getElementsByTagName("title");
                    const title = titleTag.length > 0 ? titleTag[0].textContent : "";

                    if (description) {
                        const descDoc = parser.parseFromString(description, 'text/html');
                        const imgTag = descDoc.querySelector('img');
                        
                        if (imgTag && imgTag.src) {
                            let proxySrc = imgTag.src.replace('i.pximg.net', 'i.pixiv.re');

                            const card = document.createElement('div');
                            card.className = 'pixiv-card';
                            card.innerHTML = `
                                <a href="${link.trim()}" target="_blank" rel="noopener" class="pixiv-link">
                                    <div class="pixiv-img-wrapper">
                                        <img src="${proxySrc}" alt="${title}" loading="lazy">
                                    </div>
                                </a>
                            `;
                            grid.appendChild(card);
                        }
                    }
                }
            } catch (err) {
                // Try fallback layout direct JSON converter if XML fails
                tryAlternativeJSON();
            }
        }

        async function tryAlternativeJSON() {
            try {
                const FALLBACK_URL = "https://rss2json.com" + encodeURIComponent("https://rssforever.com" + PIXIV_USER_ID);
                const response = await fetch(FALLBACK_URL);
                const data = await response.json();
                
                if(data.status === 'ok' && data.items.length > 0) {
                    status.style.display = 'none';
                    const parser = new DOMParser();
                    data.items.forEach(item => {
                        const descDoc = parser.parseFromString(item.description, 'text/html');
                        const imgTag = descDoc.querySelector('img');
                        if (imgTag && imgTag.src) {
                            let proxySrc = imgTag.src.replace('i.pximg.net', 'i.pixiv.re');
                            const card = document.createElement('div');
                            card.className = 'pixiv-card';
                            card.innerHTML = `<a href="${item.link}" target="_blank" rel="noopener" class="pixiv-link"><div class="pixiv-img-wrapper"><img src="${proxySrc}" loading="lazy"></div></a>`;
                            grid.appendChild(card);
                        }
                    });
                } else {
                    throw new Error();
                }
            } catch (e) {
                status.textContent = 'Pixiv service busy. Please check back shortly.';
            }
        }

        loadFeed();
    });
})();
</script>
