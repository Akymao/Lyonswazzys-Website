<script>
(function() {
    document.addEventListener("DOMContentLoaded", () => {
        const PIXIV_USER_ID = "41623824"; 
        
        // Bypasses un-stabilized RSS channels entirely by using a direct allorigins fetch 
        // to query the open-source pixiv token fallback endpoint.
        const TARGET_URL = "https://wordpress.com"; 
        // Note: As an absolute fail-safe if third party servers block you, this script falls back to an open JSON endpoint.
        const API_URL = "https://allorigins.win" + encodeURIComponent("https://pixiv.moe" + PIXIV_USER_ID);

        const grid = document.getElementById('pixiv-grid-box');
        const status = document.getElementById('pixiv-status-box');

        if (!grid || !status) return;

        async function fetchGallery() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error();
                const wrapper = await response.json();
                const data = JSON.parse(wrapper.contents);

                if (!data || !data.illusts || data.illusts.length === 0) {
                    throw new Error();
                }

                status.style.display = 'none';
                
                // Show up to 12 recent works
                const list = data.illusts.slice(0, 12);
                list.forEach(work => {
                    // Extract image link safely bypassing typical proxy layers
                    let imgSrc = work.image_urls.square_medium || work.image_urls.medium;
                    let proxySrc = imgSrc.replace('i.pximg.net', 'i.pixiv.re');

                    const card = document.createElement('div');
                    card.className = 'pixiv-card';
                    card.innerHTML = `
                        <a href="https://pixiv.net{work.id}" target="_blank" rel="noopener" class="pixiv-link">
                            <div class="pixiv-img-wrapper">
                                <img src="${proxySrc}" alt="${work.title}" loading="lazy">
                            </div>
                        </a>
                    `;
                    grid.appendChild(card);
                });

            } catch (e) {
                // Hardcoded Ultimate Fallback: If APIs are blocked globally by the server today,
                // this forces the loading screen to seamlessly guide users straight to your gallery profile.
                status.innerHTML = `Pixiv data layer is restricted. <a href="https://pixiv.net{PIXIV_USER_ID}" target="_blank" style="color:#0096ff; text-decoration:underline; font-weight:bold;">Click here to view my full portfolio directly on Pixiv!</a>`;
            }
        }

        fetchGallery();
    });
})();
</script>
