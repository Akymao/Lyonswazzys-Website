<style>
  .silex-slideshow-container {

  .slideshow-inner {

  .slide-img {

<script>
  // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BETWEEN THE QUOTES BELOW:
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzNDs7hdsfnl2P_k5c6NAcovDC-ifPGWryaY_GvA3NLYdmoVKPFqe3f5-p9a3JwFGz0Mw/exec';
  const SLIDE_DURATION = 4000; 

  async function loadGDriveSlideshow() {
    const container = document.getElementById('gdrive-slideshow');
    
    try {
      const response = await fetch(WEB_APP_URL);
      const imageLinks = await response.json();

      if (!imageLinks || imageLinks.length === 0) {
        container.innerHTML = '<p class="loading-text">No images found in your Drive folder.</p>';
        return;
      }

      container.innerHTML = ''; // Clear loading text

      imageLinks.forEach((url, index) => {
        const img = document.createElement('img');
        img.src = url;
        img.classList.add('slide-img');
        if (index === 0) img.classList.add('active');
        container.appendChild(img);
      });

      let currentSlide = 0;
      const slides = container.querySelectorAll('.slide-img');
      
      setInterval(() => {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
      }, SLIDE_DURATION);

    } catch (error) {
      console.error(error);
      container.innerHTML = '<p class="loading-text">Connection error. Please check your Web App URL deployment.</p>';
    }
  }

  loadGDriveSlideshow();
</script>
